<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>mcp-app-cards — live example</title>
<style>
:root{color-scheme:dark}
body{margin:0;font-family:system-ui,sans-serif;background:#101720;color:#e6edf3;padding:24px}
h1{font-size:18px;margin:0 0 4px}
p.lead{color:#8fa6bd;font-size:13px;margin:0 0 20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
section{background:#182230;border:1px solid #24334a;border-radius:14px;padding:12px}
section h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#8fa6bd;margin:2px 0 10px}
iframe{width:100%;border:0;border-radius:12px;background:#0e1620;display:block}
footer{margin-top:20px;font-size:12px;color:#8fa6bd}
code{background:#1c2839;padding:1px 5px;border-radius:5px}
</style>
</head>
<body>
<h1>mcp-app-cards</h1>
<p class="lead">Two template iframes hosted through <code>createHost()</code> — the frames post
<code>ui/ready</code>, this page replies with <code>ui/render</code>, and each frame reports its
height back via <code>ui/size-changed</code>.</p>
<div class="grid">
  <section><h2>cardsTemplate()</h2><iframe id="cards" title="Cards demo"></iframe></section>
  <section><h2>timelineTemplate()</h2><iframe id="timeline" title="Timeline demo"></iframe></section>
</div>
<footer>Run <code>npm run example</code> in the package root, then open http://localhost:5173/</footer>
<script type="module" src="app.js"></script>
</body>
</html>
